name: Oracle Report Sequencing Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run sequencing tests against Oracle Free
    runs-on: ubuntu-latest

    env:
      ORACLE_PASSWORD: TestPass123
      # gvenzl/oracle-free uses FREEPDB1 as the pluggable DB name
      ORACLE_PDB: FREEPDB1
      ORACLE_HOST: 127.0.0.1
      ORACLE_PORT: 1521

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Start Oracle Database Free (slim + pre-started image) ───────────
      # gvenzl/oracle-free:slim-faststart ships with the DB already created
      # so it starts in ~30 s instead of the usual 3-4 min build time.
      - name: Start Oracle container
        run: |
          docker run -d \
            --name oracle \
            -p ${{ env.ORACLE_PORT }}:1521 \
            -e ORACLE_PASSWORD=${{ env.ORACLE_PASSWORD }} \
            gvenzl/oracle-free:slim-faststart

      # ── 3. Wait until Oracle is accepting connections ───────────────────────
      # gvenzl/oracle-free:slim-faststart has no Docker HEALTHCHECK, so we
      # grep the container logs for the banner the entrypoint prints when the
      # DB is fully open and accepting connections.
      - name: Wait for Oracle to be healthy
        run: |
          echo "Waiting for Oracle Database to become ready..."
          MAX_TRIES=60
          for i in $(seq 1 $MAX_TRIES); do
            if docker logs oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then
              echo "Oracle is ready after $i attempts."
              break
            fi
            if [ "$i" -eq "$MAX_TRIES" ]; then
              echo "ERROR: Oracle did not become ready in time."
              docker logs oracle
              exit 1
            fi
            echo "  Attempt $i/$MAX_TRIES – not ready yet, sleeping 5 s..."
            sleep 5
          done

      # ── 4. Copy SQL artifacts into the container ───────────────────────────
      - name: Copy SQL files into container
        run: |
          docker exec oracle mkdir -p /tmp/sql /tmp/tests
          docker cp sql/01_schema.sql   oracle:/tmp/sql/01_schema.sql
          docker cp sql/02_function.sql oracle:/tmp/sql/02_function.sql
          docker cp sql/03_test_data.sql oracle:/tmp/sql/03_test_data.sql
          docker cp tests/test_sequencing.sql oracle:/tmp/tests/test_sequencing.sql

      # Helper used in every SQLPlus step.
      # bash -lc sources /etc/profile.d/* so Oracle's bin dir is on PATH.
      # The connection uses Easy Connect inside the container (loopback).

      # ── 5. Create schema (table) ───────────────────────────────────────────
      - name: Create schema
        run: |
          docker exec oracle bash -lc "sqlplus -S \
            system/${{ env.ORACLE_PASSWORD }}@//${{ env.ORACLE_HOST }}:${{ env.ORACLE_PORT }}/${{ env.ORACLE_PDB }} \
            @/tmp/sql/01_schema.sql"

      # ── 6. Compile function ────────────────────────────────────────────────
      - name: Compile get_next_report_number function
        run: |
          docker exec oracle bash -lc "sqlplus -S \
            system/${{ env.ORACLE_PASSWORD }}@//${{ env.ORACLE_HOST }}:${{ env.ORACLE_PORT }}/${{ env.ORACLE_PDB }} \
            @/tmp/sql/02_function.sql"

      # ── 7. Seed test data ──────────────────────────────────────────────────
      - name: Seed mock test data
        run: |
          docker exec oracle bash -lc "sqlplus -S \
            system/${{ env.ORACLE_PASSWORD }}@//${{ env.ORACLE_HOST }}:${{ env.ORACLE_PORT }}/${{ env.ORACLE_PDB }} \
            @/tmp/sql/03_test_data.sql"

      # ── 8. Run tests ───────────────────────────────────────────────────────
      # WHENEVER SQLERROR EXIT FAILURE inside the script causes SQLPlus to
      # return a non-zero exit code on any assertion failure, which makes
      # this step (and the whole job) fail visibly in the Actions UI.
      - name: Run sequencing tests
        run: |
          docker exec oracle bash -lc "sqlplus -S \
            system/${{ env.ORACLE_PASSWORD }}@//${{ env.ORACLE_HOST }}:${{ env.ORACLE_PORT }}/${{ env.ORACLE_PDB }} \
            @/tmp/tests/test_sequencing.sql"

      # ── 9. Always dump Oracle container logs on failure ────────────────────
      - name: Dump Oracle container logs on failure
        if: failure()
        run: docker logs oracle
